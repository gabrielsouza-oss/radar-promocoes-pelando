name: Atualizar ofertas do Pelando

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pelando-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Executar notebook
        run: >-
          jupyter nbconvert --to notebook --execute pelando_promocoes.ipynb
          --output pelando_promocoes_executed.ipynb
          --ExecutePreprocessor.timeout=900

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar pagina
        run: |
          mkdir -p _site
          cp pelando_ofertas.html _site/index.html

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
